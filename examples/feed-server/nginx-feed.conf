# Cyan-Nook 外部アクションフィード用 受け渡しサーバー設定
#
# 役割: 4つの固定ファイル (action.json / context.json / camera.jpg / voice.wav) を
#       HTTP PUT で受け取り、HTTP GET で返すだけの小さなファイル置き場。
#       外部エージェント (Hermes / herald 等) と Cyan-Nook の間のデータ交換ハブになる。
#
# 認証なし前提のため、閉じたネットワーク (LAN / Tailscale) 内でのみ使うこと。
# インターネットには絶対に公開しない。

server {
    listen 80;

    root /data;

    # camera.jpg (256x256 jpeg 想定) と voice.wav (VOICEVOX 24kHz mono、
    # 10m ≒ 約200秒分) に十分な上限。必要なら調整
    client_max_body_size 10m;

    # 許可するのは4つの固定ファイルのみ (それ以外のパスは下の location / で 404)。
    # クライアントが任意のファイル名を書き込める構造にしないことが安全の要
    location ~ ^/feed/(action\.json|context\.json|camera\.jpg|voice\.wav)$ {
        # PUT でファイル作成・上書きを許可 (DELETE 等は許可しない)
        dav_methods PUT;
        dav_access user:rw group:rw all:r;

        # CORS: WebGL 版 Cyan-Nook からのアクセスに必要。
        # - PUT はブラウザがプリフライト (OPTIONS) を先に送るため、
        #   Allow-Methods に PUT、Allow-Headers に Content-Type が必須
        # - Cyan-Nook は GET に Cache-Control/Pragma ヘッダを付けるため、
        #   これらも Allow-Headers に無いとプリフライトで弾かれる
        # (Unity エディタからのアクセスは CORS の影響を受けない)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control, Pragma" always;

        # 常に最新を返す (古い action の再適用防止)
        add_header Cache-Control "no-store" always;

        # プリフライトには本文なしで即応答
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # フィード3ファイル以外へのアクセスは全て拒否
    location / {
        return 404;
    }
}
